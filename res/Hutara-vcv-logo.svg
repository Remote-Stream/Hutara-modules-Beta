<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
<defs>
<linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" style="stop-color:#e91e8c;stop-opacity:1" />
<stop offset="35%" style="stop-color:#ff2fb3;stop-opacity:1" />
<stop offset="65%" style="stop-color:#c026d3;stop-opacity:1" />
<stop offset="100%" style="stop-color:#e91e8c;stop-opacity:1" />
</linearGradient>
<linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" style="stop-color:#ff2fb3;stop-opacity:1" />
<stop offset="50%" style="stop-color:#e91e8c;stop-opacity:1" />
<stop offset="100%" style="stop-color:#c026d3;stop-opacity:1" />
</linearGradient>
<filter id="softGlow">
<feGaussianBlur stdDeviation="2.5" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>

<!-- ========== LEFT SIDE: EYE MANDALA (Modular Eye) ========== -->
<g transform="translate(140, 150)">

<!-- Outer radiating petals (mandala ring) -->
<g fill="none" stroke="url(#mainGrad)" stroke-width="2.2" stroke-linecap="round">

<!-- Top petals -->
<path d="M 0,-92 C 18,-78 22,-58 0,-48 C -22,-58 -18,-78 0,-92 Z"/>
<path d="M 65,-65 C 72,-42 60,-28 42,-32 C 38,-52 48,-68 65,-65 Z"/>
<path d="M -65,-65 C -72,-42 -60,-28 -42,-32 C -38,-52 -48,-68 -65,-65 Z"/>
<path d="M 92,0 C 78,18 58,22 48,0 C 58,-22 78,-18 92,0 Z"/>
<path d="M -92,0 C -78,18 -58,22 -48,0 C -58,-22 -78,-18 -92,0 Z"/>
<path d="M 65,65 C 42,72 28,60 32,42 C 52,38 68,48 65,65 Z"/>
<path d="M -65,65 C -42,72 -28,60 -32,42 C -52,38 -68,48 -65,65 Z"/>
<path d="M 0,92 C 18,78 22,58 0,48 C -22,58 -18,78 0,92 Z"/>

<!-- Intermediate smaller petals -->
<path d="M 35,-85 C 45,-70 40,-55 28,-52 C 20,-65 24,-80 35,-85 Z"/>
<path d="M -35,-85 C -45,-70 -40,-55 -28,-52 C -20,-65 -24,-80 -35,-85 Z"/>
<path d="M 85,-35 C 70,-45 55,-40 52,-28 C 65,-20 80,-24 85,-35 Z"/>
<path d="M -85,-35 C -70,-45 -55,-40 -52,-28 C -65,-20 -80,-24 -85,-35 Z"/>
<path d="M 85,35 C 70,45 55,40 52,28 C 65,20 80,24 85,35 Z"/>
<path d="M -85,35 C -70,45 -55,40 -52,28 C -65,20 -80,24 -85,35 Z"/>
<path d="M 35,85 C 45,70 40,55 28,52 C 20,65 24,80 35,85 Z"/>
<path d="M -35,85 C -45,70 -40,55 -28,52 C -20,65 -24,80 -35,85 Z"/>

<!-- Inner eye-shaped petals -->
<path d="M 0,-60 Q 20,-40 0,-28 Q -20,-40 0,-60 Z" stroke-width="1.8"/>
<path d="M 50,-35 Q 45,-15 28,-8 Q 22,-25 50,-35 Z" stroke-width="1.8"/>
<path d="M -50,-35 Q -45,-15 -28,-8 Q -22,-25 -50,-35 Z" stroke-width="1.8"/>
<path d="M 60,0 Q 45,15 28,8 Q 22,-10 60,0 Z" stroke-width="1.8"/>
<path d="M -60,0 Q -45,15 -28,8 Q -22,-10 -60,0 Z" stroke-width="1.8"/>
<path d="M 50,35 Q 30,40 22,25 Q 35,15 50,35 Z" stroke-width="1.8"/>
<path d="M -50,35 Q -30,40 -22,25 Q -35,15 -50,35 Z" stroke-width="1.8"/>
<path d="M 0,60 Q 15,40 0,28 Q -15,40 0,60 Z" stroke-width="1.8"/>
</g>

<!-- Dots in petal centers -->
<g fill="#ff2fb3" opacity="0.9">
<circle cx="0" cy="-70" r="2.5"/>
<circle cx="55" cy="-55" r="2.5"/>
<circle cx="-55" cy="-55" r="2.5"/>
<circle cx="70" cy="0" r="2.5"/>
<circle cx="-70" cy="0" r="2.5"/>
<circle cx="55" cy="55" r="2.5"/>
<circle cx="-55" cy="55" r="2.5"/>
<circle cx="0" cy="70" r="2.5"/>
</g>

<!-- Circle ring -->
<circle cx="0" cy="0" r="38" fill="none" stroke="url(#mainGrad)" stroke-width="2.5"/>
<circle cx="0" cy="0" r="34" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1"/>

<!-- ===== JACK SOCKETS around the eye (modular synth reference) ===== -->
<g>
<!-- Top jack -->
<circle cx="0" cy="-46" r="6" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.8"/>
<circle cx="0" cy="-46" r="2.5" fill="#ff2fb3"/>
<line x1="0" y1="-56" x2="0" y2="-52" stroke="#e91e8c" stroke-width="1.5"/>

<!-- Bottom jack -->
<circle cx="0" cy="46" r="6" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.8"/>
<circle cx="0" cy="46" r="2.5" fill="#ff2fb3"/>
<line x1="0" y1="52" x2="0" y2="56" stroke="#e91e8c" stroke-width="1.5"/>

<!-- Left jack -->
<circle cx="-46" cy="0" r="6" fill="#0d0d0d" stroke="#c026d3" stroke-width="1.8"/>
<circle cx="-46" cy="0" r="2.5" fill="#c026d3"/>

<!-- Right jack -->
<circle cx="46" cy="0" r="6" fill="#0d0d0d" stroke="#c026d3" stroke-width="1.8"/>
<circle cx="46" cy="0" r="2.5" fill="#c026d3"/>

<!-- Diagonal jacks -->
<circle cx="-32" cy="-32" r="5" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.6"/>
<circle cx="-32" cy="-32" r="2" fill="#ff2fb3"/>
<circle cx="32" cy="-32" r="5" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.6"/>
<circle cx="32" cy="-32" r="2" fill="#ff2fb3"/>
<circle cx="-32" cy="32" r="5" fill="#0d0d0d" stroke="#c026d3" stroke-width="1.6"/>
<circle cx="-32" cy="32" r="2" fill="#c026d3"/>
<circle cx="32" cy="32" r="5" fill="#0d0d0d" stroke="#c026d3" stroke-width="1.6"/>
<circle cx="32" cy="32" r="2" fill="#c026d3"/>
</g>

<!-- Central eye -->
<g>
<!-- Eye white -->
<ellipse cx="0" cy="0" rx="26" ry="17" fill="#f0e6f0" stroke="#e91e8c" stroke-width="2"/>
<!-- Iris -->
<circle cx="0" cy="0" r="12" fill="#1a0a2e"/>
<circle cx="0" cy="0" r="12" fill="none" stroke="#ff2fb3" stroke-width="1.5"/>
<!-- Pupil -->
<circle cx="0" cy="0" r="5" fill="#000"/>
<!-- Highlight -->
<circle cx="4" cy="-4" r="2.5" fill="#ffffff" opacity="0.8"/>
<!-- Radiating iris lines -->
<g stroke="#ff2fb3" stroke-width="0.7" opacity="0.6">
<line x1="0" y1="-11" x2="0" y2="-7"/>
<line x1="8" y1="-8" x2="5" y2="-5"/>
<line x1="-8" y1="-8" x2="-5" y2="-5"/>
<line x1="11" y1="0" x2="7" y2="0"/>
<line x1="-11" y1="0" x2="-7" y2="0"/>
<line x1="8" y1="8" x2="5" y2="5"/>
<line x1="-8" y1="8" x2="-5" y2="5"/>
<line x1="0" y1="11" x2="0" y2="7"/>
</g>
<!-- Eyelid lines -->
<path d="M -26,0 Q -20,-8 -12,-10" fill="none" stroke="#0d0d0d" stroke-width="1.5"/>
<path d="M 26,0 Q 20,-8 12,-10" fill="none" stroke="#0d0d0d" stroke-width="1.5"/>
</g>

<!-- Ornamental swirls below eye -->
<g fill="none" stroke="url(#mainGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
<path d="M -20,50 Q -35,65 -25,80 Q -15,70 -20,55"/>
<path d="M 20,50 Q 35,65 25,80 Q 15,70 20,55"/>
<path d="M -40,60 Q -55,75 -45,90"/>
<path d="M 40,60 Q 55,75 45,90"/>
<path d="M -10,60 Q -5,75 -15,85"/>
<path d="M 10,60 Q 5,75 15,85"/>
</g>

<!-- Small leaf accents -->
<g fill="url(#mainGrad)" opacity="0.5">
<ellipse cx="-50" cy="75" rx="6" ry="3" transform="rotate(-30 -50 75)"/>
<ellipse cx="50" cy="75" rx="6" ry="3" transform="rotate(30 50 75)"/>
<ellipse cx="-35" cy="88" rx="5" ry="2.5" transform="rotate(-50 -35 88)"/>
<ellipse cx="35" cy="88" rx="5" ry="2.5" transform="rotate(50 35 88)"/>
</g>
</g>

<!-- ========== CENTER: TEXT "HUTARA" ========== -->
<g transform="translate(490, 150)">

<!-- Subtle underline flourish -->
<path d="M -140,42 Q -70,52 0,44 Q 70,52 140,42" fill="none" stroke="url(#mainGrad)" stroke-width="2" opacity="0.7"/>

<!-- Main text -->
<text x="0" y="18" font-family="'Arial Black', 'Impact', 'Helvetica', sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="url(#mainGrad)" filter="url(#softGlow)" letter-spacing="8">HUTARA</text>

<!-- Subtle inner shadow for depth -->
<text x="0" y="18" font-family="'Arial Black', 'Impact', 'Helvetica', sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="none" stroke="#1a0a2e" stroke-width="2" opacity="0.5" letter-spacing="8">HUTARA</text>

<!-- Top decorative line -->
<line x1="-120" y1="-50" x2="120" y2="-50" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.6"/>
<circle cx="-120" cy="-50" r="2.5" fill="#e91e8c"/>
<circle cx="120" cy="-50" r="2.5" fill="#c026d3"/>

<!-- ===== PATCH CABLE / WAVEFORM (Modular synth reference above text) ===== -->
<g transform="translate(0, -80)">
<!-- Patch cable going from left jack to right jack -->
<path d="M -110,10 C -80,-25 -40,-25 0,-15 C 40,-5 80,-5 110,20"
fill="none" stroke="#e91e8c" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>

<!-- Cable plugs -->
<circle cx="-110" cy="10" r="4" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.5"/>
<circle cx="-110" cy="10" r="1.5" fill="#ff2fb3"/>
<circle cx="110" cy="20" r="4" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.5"/>
<circle cx="110" cy="20" r="1.5" fill="#ff2fb3"/>

<!-- Audio waveform inside the curve -->
<path d="M -70,5 L -60,5 L -55,-3 L -50,13 L -45,5 L -35,5 L -30,-5 L -25,15 L -20,5 L -10,5 L -5,-3 L 0,13 L 5,5 L 15,5 L 20,-5 L 25,15 L 30,5 L 40,5 L 45,-3 L 50,13 L 55,5 L 65,5 L 70,-5 L 75,15 L 80,5 L 90,5"
fill="none" stroke="#ff2fb3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#softGlow)"/>
</g>

<!-- Small diamond accents -->
<polygon points="-80,-58 -76,-54 -80,-50 -84,-54" fill="#ff2fb3" opacity="0.7"/>
<polygon points="80,-58 84,-54 80,-50 76,-54" fill="#ff2fb3" opacity="0.7"/>
<polygon points="-40,-58 -38,-55 -40,-52 -42,-55" fill="#c026d3" opacity="0.6"/>
<polygon points="40,-58 42,-55 40,-52 38,-55" fill="#c026d3" opacity="0.6"/>

<!-- ===== KNOBS & SLIDERS (Modular synth reference below text) ===== -->
<g transform="translate(0, 95)">
<!-- Knob 1 -->
<circle cx="-90" cy="0" r="8" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.5"/>
<line x1="-90" y1="0" x2="-90" y2="-6" stroke="#ff2fb3" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="-90" cy="0" r="3" fill="#c026d3"/>

<!-- Knob 2 -->
<circle cx="-60" cy="0" r="8" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.5"/>
<line x1="-60" y1="0" x2="-55" y2="-5" stroke="#ff2fb3" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="-60" cy="0" r="3" fill="#c026d3"/>

<!-- Knob 3 -->
<circle cx="-30" cy="0" r="8" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.5"/>
<line x1="-30" y1="0" x2="-26" y2="-6" stroke="#ff2fb3" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="-30" cy="0" r="3" fill="#c026d3"/>

<!-- Fader / Slider 1 -->
<rect x="-8" y="-12" width="6" height="24" rx="2" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.2"/>
<rect x="-7" y="-8" width="4" height="5" rx="1" fill="#ff2fb3"/>

<!-- Fader / Slider 2 -->
<rect x="8" y="-12" width="6" height="24" rx="2" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.2"/>
<rect x="9" y="0" width="4" height="5" rx="1" fill="#ff2fb3"/>

<!-- Knob 4 -->
<circle cx="35" cy="0" r="8" fill="#0d0d0d" stroke="#c026d3" stroke-width="1.5"/>
<line x1="35" y1="0" x2="39" y2="-6" stroke="#c026d3" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="35" cy="0" r="3" fill="#e91e8c"/>

<!-- Knob 5 -->
<circle cx="65" cy="0" r="8" fill="#0d0d0d" stroke="#c026d3" stroke-width="1.5"/>
<line x1="65" y1="0" x2="70" y2="-5" stroke="#c026d3" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="65" cy="0" r="3" fill="#e91e8c"/>

<!-- Knob 6 -->
<circle cx="95" cy="0" r="8" fill="#0d0d0d" stroke="#c026d3" stroke-width="1.5"/>
<line x1="95" y1="0" x2="95" y2="-6" stroke="#c026d3" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="95" cy="0" r="3" fill="#e91e8c"/>
</g>

<!-- ===== VCV RACK RAIL HINT (subtle) ===== -->
<g opacity="0.25">
<line x1="-160" y1="120" x2="160" y2="120" stroke="#e91e8c" stroke-width="1"/>
<circle cx="-160" cy="120" r="1.5" fill="#e91e8c"/>
<circle cx="160" cy="120" r="1.5" fill="#e91e8c"/>
</g>
</g>

<!-- ========== SMALL DECORATIVE ELEMENTS ========== -->
<!-- Tiny eye motif near text -->
<g transform="translate(490, 255)" opacity="0.35">
<ellipse cx="0" cy="0" rx="10" ry="6" fill="none" stroke="#e91e8c" stroke-width="1"/>
<circle cx="0" cy="0" r="3" fill="#e91e8c"/>
</g>

<!-- Corner diamond accents -->
<g opacity="0.3">
<polygon points="830,30 840,40 830,50 820,40" fill="#c026d3"/>
<polygon points="70,250 80,260 70,270 60,260" fill="#e91e8c"/>
</g>

<!-- ===== SMALL PATCH CABLE SVG ON FAR RIGHT (decorative) ===== -->
<g transform="translate(830, 150)" opacity="0.4">
<path d="M 0,-30 C 15,-30 15,30 0,30" fill="none" stroke="#e91e8c" stroke-width="1.5"/>
<circle cx="0" cy="-30" r="3" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1"/>
<circle cx="0" cy="30" r="3" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1"/>
</g>

<!-- ===== SMALL JACK SOCKET (decorative far left) ===== -->
<g transform="translate(70, 150)" opacity="0.4">
<circle cx="0" cy="-25" r="5" fill="#0d0d0d" stroke="#c026d3" stroke-width="1.3"/>
<circle cx="0" cy="-25" r="1.8" fill="#c026d3"/>
<circle cx="0" cy="0" r="5" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.3"/>
<circle cx="0" cy="0" r="1.8" fill="#e91e8c"/>
<circle cx="0" cy="25" r="5" fill="#0d0d0d" stroke="#c026d3" stroke-width="1.3"/>
<circle cx="0" cy="25" r="1.8" fill="#c026d3"/>
</g>
</svg>