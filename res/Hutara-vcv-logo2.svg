<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="280" height="300">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e91e8c;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#ff2fb3;stop-opacity:1" />
      <stop offset="65%" style="stop-color:#c026d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e91e8c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ========== LEFT SIDE: EYE MANDALA (Modular Eye) ========== -->
  <g transform="translate(140, 150)">

    <!-- Outer radiating petals (mandala ring) -->
    <g fill="none" stroke="url(#mainGrad)" stroke-width="2.2" stroke-linecap="round">

      <!-- Top petals -->
      <path d="M 0,-92 C 18,-78 22,-58 0,-48 C -22,-58 -18,-78 0,-92 Z"/>
      <path d="M 65,-65 C 72,-42 60,-28 42,-32 C 38,-52 48,-68 65,-65 Z"/>
      <path d="M -65,-65 C -72,-42 -60,-28 -42,-32 C -38,-52 -48,-68 -65,-65 Z"/>
      <path d="M 92,0 C 78,18 58,22 48,0 C 58,-22 78,-18 92,0 Z"/>
      <path d="M -92,0 C -78,18 -58,22 -48,0 C -58,-22 -78,-18 -92,0 Z"/>
      <path d="M 65,65 C 42,72 28,60 32,42 C 52,38 68,48 65,65 Z"/>
      <path d="M -65,65 C -42,72 -28,60 -32,42 C -52,38 -68,48 -65,65 Z"/>
      <path d="M 0,92 C 18,78 22,58 0,48 C -22,58 -18,78 0,92 Z"/>

      <!-- Intermediate smaller petals -->
      <path d="M 35,-85 C 45,-70 40,-55 28,-52 C 20,-65 24,-80 35,-85 Z"/>
      <path d="M -35,-85 C -45,-70 -40,-55 -28,-52 C -20,-65 -24,-80 -35,-85 Z"/>
      <path d="M 85,-35 C 70,-45 55,-40 52,-28 C 65,-20 80,-24 85,-35 Z"/>
      <path d="M -85,-35 C -70,-45 -55,-40 -52,-28 C -65,-20 -80,-24 -85,-35 Z"/>
      <path d="M 85,35 C 70,45 55,40 52,28 C 65,20 80,24 85,35 Z"/>
      <path d="M -85,35 C -70,45 -55,40 -52,28 C -65,20 -80,24 -85,35 Z"/>
      <path d="M 35,85 C 45,70 40,55 28,52 C 20,65 24,80 35,85 Z"/>
      <path d="M -35,85 C -45,70 -40,55 -28,52 C -20,65 -24,80 -35,85 Z"/>

      <!-- Inner eye-shaped petals -->
      <path d="M 0,-60 Q 20,-40 0,-28 Q -20,-40 0,-60 Z" stroke-width="1.8"/>
      <path d="M 50,-35 Q 45,-15 28,-8 Q 22,-25 50,-35 Z" stroke-width="1.8"/>
      <path d="M -50,-35 Q -45,-15 -28,-8 Q -22,-25 -50,-35 Z" stroke-width="1.8"/>
      <path d="M 60,0 Q 45,15 28,8 Q 22,-10 60,0 Z" stroke-width="1.8"/>
      <path d="M -60,0 Q -45,15 -28,8 Q -22,-10 -60,0 Z" stroke-width="1.8"/>
      <path d="M 50,35 Q 30,40 22,25 Q 35,15 50,35 Z" stroke-width="1.8"/>
      <path d="M -50,35 Q -30,40 -22,25 Q -35,15 -50,35 Z" stroke-width="1.8"/>
      <path d="M 0,60 Q 15,40 0,28 Q -15,40 0,60 Z" stroke-width="1.8"/>
    </g>

    <!-- Dots in petal centers -->
    <g fill="#ff2fb3" opacity="0.9">
      <circle cx="0" cy="-70" r="2.5"/>
      <circle cx="55" cy="-55" r="2.5"/>
      <circle cx="-55" cy="-55" r="2.5"/>
      <circle cx="70" cy="0" r="2.5"/>
      <circle cx="-70" cy="0" r="2.5"/>
      <circle cx="55" cy="55" r="2.5"/>
      <circle cx="-55" cy="55" r="2.5"/>
      <circle cx="0" cy="70" r="2.5"/>
    </g>

    <!-- Circle ring -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#mainGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="34" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1"/>

    <!-- ===== JACK SOCKETS around the eye ===== -->
    <g>
      <!-- Top jack -->
      <circle cx="0" cy="-46" r="6" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.8"/>
      <circle cx="0" cy="-46" r="2.5" fill="#ff2fb3"/>
      <line x1="0" y1="-56" x2="0" y2="-52" stroke="#e91e8c" stroke-width="1.5"/>

      <!-- Bottom jack -->
      <circle cx="0" cy="46" r="6" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.8"/>
      <circle cx="0" cy="46" r="2.5" fill="#ff2fb3"/>
      <line x1="0" y1="52" x2="0" y2="56" stroke="#e91e8c" stroke-width="1.5"/>

      <!-- Left jack -->
      <circle cx="-46" cy="0" r="6" fill="#0d0d0d" stroke="#c026d3" stroke-width="1.8"/>
      <circle cx="-46" cy="0" r="2.5" fill="#c026d3"/>

      <!-- Right jack -->
      <circle cx="46" cy="0" r="6" fill="#0d0d0d" stroke="#c026d3" stroke-width="1.8"/>
      <circle cx="46" cy="0" r="2.5" fill="#c026d3"/>

      <!-- Diagonal jacks -->
      <circle cx="-32" cy="-32" r="5" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.6"/>
      <circle cx="-32" cy="-32" r="2" fill="#ff2fb3"/>
      <circle cx="32" cy="-32" r="5" fill="#0d0d0d" stroke="#e91e8c" stroke-width="1.6"/>
      <circle cx="32" cy="-32" r="2" fill="#ff2fb3"/>
      <circle cx="-32" cy="32" r="5" fill="#0d0d0d" stroke="#c026d3" stroke-width="1.6"/>
      <circle cx="-32" cy="32" r="2" fill="#c026d3"/>
      <circle cx="32" cy="32" r="5" fill="#0d0d0d" stroke="#c026d3" stroke-width="1.6"/>
      <circle cx="32" cy="32" r="2" fill="#c026d3"/>
    </g>

    <!-- Central eye -->
    <g>
      <!-- Eye white -->
      <ellipse cx="0" cy="0" rx="26" ry="17" fill="#f0e6f0" stroke="#e91e8c" stroke-width="2"/>
      <!-- Iris -->
      <circle cx="0" cy="0" r="12" fill="#1a0a2e"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#ff2fb3" stroke-width="1.5"/>
      <!-- Pupil -->
      <circle cx="0" cy="0" r="5" fill="#000"/>
      <!-- Highlight -->
      <circle cx="4" cy="-4" r="2.5" fill="#ffffff" opacity="0.8"/>
      <!-- Radiating iris lines -->
      <g stroke="#ff2fb3" stroke-width="0.7" opacity="0.6">
        <line x1="0" y1="-11" x2="0" y2="-7"/>
        <line x1="8" y1="-8" x2="5" y2="-5"/>
        <line x1="-8" y1="-8" x2="-5" y2="-5"/>
        <line x1="11" y1="0" x2="7" y2="0"/>
        <line x1="-11" y1="0" x2="-7" y2="0"/>
        <line x1="8" y1="8" x2="5" y2="5"/>
        <line x1="-8" y1="8" x2="-5" y2="5"/>
        <line x1="0" y1="11" x2="0" y2="7"/>
      </g>
      <!-- Eyelid lines -->
      <path d="M -26,0 Q -20,-8 -12,-10" fill="none" stroke="#0d0d0d" stroke-width="1.5"/>
      <path d="M 26,0 Q 20,-8 12,-10" fill="none" stroke="#0d0d0d" stroke-width="1.5"/>
    </g>

    <!-- Ornamental swirls below eye -->
    <g fill="none" stroke="url(#mainGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
      <path d="M -20,50 Q -35,65 -25,80 Q -15,70 -20,55"/>
      <path d="M 20,50 Q 35,65 25,80 Q 15,70 20,55"/>
      <path d="M -40,60 Q -55,75 -45,90"/>
      <path d="M 40,60 Q 55,75 45,90"/>
      <path d="M -10,60 Q -5,75 -15,85"/>
      <path d="M 10,60 Q 5,75 15,85"/>
    </g>

    <!-- Small leaf accents -->
    <g fill="url(#mainGrad)" opacity="0.5">
      <ellipse cx="-50" cy="75" rx="6" ry="3" transform="rotate(-30 -50 75)"/>
      <ellipse cx="50" cy="75" rx="6" ry="3" transform="rotate(30 50 75)"/>
      <ellipse cx="-35" cy="88" rx="5" ry="2.5" transform="rotate(-50 -35 88)"/>
      <ellipse cx="35" cy="88" rx="5" ry="2.5" transform="rotate(50 35 88)"/>
    </g>
  </g>
</svg>