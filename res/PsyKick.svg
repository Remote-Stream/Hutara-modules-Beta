  <rect x="2.0" y="94.0" width="87.44" height="25.5" fill="#ff2fb3" fill-opacity="0.03"/>
  <rect x="2.0" y="119.5" width="87.44" height="6.9" fill="#e6a020" fill-opacity="0.032"/>

